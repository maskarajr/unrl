name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump
        type: choice
        options: [patch, minor, major]
        default: patch
      branch:
        description: Branch to release from (production)
        type: string
        default: main
      dry_run:
        description: Bump and build only — no git push, no npm
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Bump version and changelog
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VER=$(node -p "require('./package.json').version")
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          node scripts/cut-changelog.mjs "$VER"

      - name: Commit tag and GitHub Release
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag "v${VERSION}"
          git push origin "HEAD:${{ inputs.branch }}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "${VERSION}" -F RELEASE_NOTES.md

      - name: Publish to npmjs
        if: ${{ inputs.dry_run != 'true' }}
        run: npm publish --access public

      - name: Publish to GitHub Packages
        if: ${{ inputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CFG="$RUNNER_TEMP/github.npmrc"
          echo "@maskarajr:registry=https://npm.pkg.github.com" > "$CFG"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$CFG"
          NPM_CONFIG_USERCONFIG="$CFG" npm publish --access public
